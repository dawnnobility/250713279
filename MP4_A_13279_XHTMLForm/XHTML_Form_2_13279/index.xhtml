<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>
<body>

    <h1>Formulir Pendaftaran Seminar</h1>

    <form action="" method="post">
        <h2>Data Peserta</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;"><strong>Nama Lengkap</strong></td>
                <td><input type="text" name="nama" size="30" /></td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>NIM</strong></td>
                <td><input type="text" name="nim" size="30" /></td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Jenis Kelamin</strong></td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki" />
                    <label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Program Studi</strong></td>
                <td>
                    <select name="prodi">
                        <option>Informatika</option>
                    </select>
                </td>
            </tr>
        </table>
        <br />
        <h2>Pilihan Seminar</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;"><strong>Jenis Tiket</strong></td>
                <td>
                    <input type="radio" id="reguler" name="tiket" value="Reguler" />
                    <label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="tiket" value="VIP" />
                    <label for="vip">VIP</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Topik Seminar</strong></td>
                <td>
                    <input type="checkbox" id="webdev" name="topik" value="Web Development" />
                    <label for="webdev">Web Development</label><br />
                    <input type="checkbox" id="datascience" name="topik" value="Data Science" />
                    <label for="datascience">Data Science</label><br />
                    <input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" />
                    <label for="ai">Artificial Intelligence</label>
                </td>
            </tr>
        </table>
        <br />
        <h2>Informasi Tambahan</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%; vertical-align: top;"><strong>Alasan Mengikuti Seminar</strong></td>
                <td>
                    <textarea name="alasan" rows="5" cols="40"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;"><strong>Bukti Pembayaran</strong></td>
                <td>
                    <input type="file" name="bukti" />
                </td>
            </tr>
            <tr>
                <!-- Tombol Simpan: merge 2 kolom dan rata tengah -->
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan" value="Simpan" />
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
